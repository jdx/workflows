name: release-plz

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-plz

jobs:
  release-plz:
    if: github.repository == 'jdx/workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN || github.token }}
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: mise run release-plz
        env:
          DRY_RUN: 0
          # A PAT so the release PR runs CI; GITHUB_TOKEN still opens it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN || github.token }}

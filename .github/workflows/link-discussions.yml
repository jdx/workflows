name: link-discussions

# Reusable workflow: when a pull request merges, comment on each discussion
# its body references and close the ones named with a closing keyword.
#
# GitHub closes issues named with `Fixes #N`, but not discussions. This
# workflow does that for discussions. It reads references the same way as
# comment-release-fixes.yml, so a discussion this closes is the one that later
# gets the "Fixed in vX" comment:
#
#   Fixes #42, Fixes: #42, Closes discussion #42,
#   Fixes https://github.com/OWNER/REPO/discussions/42  -> comment + close
#   Refs #42, Discussion: #42                           -> comment only
#
# URLs to other repositories, and references inside HTML comments, code
# blocks, inline code, indented code or `>` quotes are ignored. Issue and pull
# request numbers are skipped. Each comment carries a marker, so a re-run does
# not comment twice.
#
# Caller repos add:
#
#   name: link-discussions
#   on:
#     pull_request_target: # zizmor: ignore[dangerous-triggers]
#       types: [closed]
#   permissions: {}
#   jobs:
#     link-discussions:
#       if: github.event.pull_request.merged == true
#       permissions:
#         contents: read
#         issues: read
#         pull-requests: read
#         discussions: write
#       uses: jdx/workflows/.github/workflows/link-discussions.yml@<sha> # vX.Y.Z
#
# The caller must use pull_request_target: on pull_request, a merged fork PR
# gets a read-only token and can't comment on or close discussions. That is
# safe here because this workflow never checks out or runs the pull request's
# code; it reads the PR body through the API. The zizmor ignore records that
# for the dangerous-triggers audit.
#
# Run it by hand with workflow_dispatch (a dry run by default) to preview or
# repair a merged pull request.
on:
  workflow_dispatch:
    inputs:
      pr_number: { required: true, type: number }
      dry_run: { required: false, type: boolean, default: true }
      comment_author: { required: false, type: string, default: 'github-actions[bot]' }
  workflow_call:
    inputs:
      pr_number: { required: false, type: number, description: 'Defaults to the triggering pull request' }
      dry_run: { required: false, type: boolean, default: false }
      comment_author: { required: false, type: string, default: 'github-actions[bot]' }
jobs:
  link:
    runs-on: ubuntu-latest
    # Serialize runs for one PR, so a manual repair overlapping the merge run
    # sees the other run's marker instead of posting a second comment.
    concurrency:
      group: link-discussions-${{ github.repository }}-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jdx/workflows
          # Immutable shared-code pin: never execute a caller checkout.
          ref: c2da024b267221561fe0e2721f419c85a690f175
          path: workflows
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          COMMENT_AUTHOR: ${{ inputs.comment_author }}
        run: python3 workflows/scripts/link-discussions.py

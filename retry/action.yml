name: retry
description: Run a command, retrying it on failure or timeout

# Composite action: a dependency-free replacement for nick-fields/retry.
#
# Caller steps add:
#
#   - uses: jdx/workflows/retry@<sha> # vX.Y.Z
#     with:
#       command: cargo test
#       max_attempts: 3
#       timeout_minutes: 30
#       retry_wait_seconds: 30
#
# The retry loop always runs in bash (Git Bash on Windows runners), so set
# `shell: pwsh` (PowerShell 7.3 or newer) to have each attempt run `command` as
# PowerShell instead.
# Each attempt is killed after `timeout_minutes`, using `timeout` or `gtimeout`
# when installed and a built-in watchdog otherwise (hosted macOS runners).

inputs:
  command:
    description: The command to run
    required: true
  shell:
    description: Shell that runs the command, `bash` or `pwsh`
    required: false
    default: bash
  max_attempts:
    description: Number of times to run the command before giving up
    required: false
    default: "3"
  timeout_minutes:
    description: Minutes after which an attempt is killed and counts as failed, 0 for no limit
    required: false
    default: "10"
  retry_wait_seconds:
    description: Seconds to wait between attempts
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RETRY_COMMAND: ${{ inputs.command }}
        RETRY_SHELL: ${{ inputs.shell }}
        RETRY_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        RETRY_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        RETRY_WAIT_SECONDS: ${{ inputs.retry_wait_seconds }}
      run: |
        case "$RETRY_SHELL" in
          bash) run=(bash -c "$RETRY_COMMAND") ;;
          pwsh)
            # -Command only reports the last statement's status, so stop on
            # errors and fail on the exit code of a native command.
            ps_command=$'if ($PSVersionTable.PSVersion -lt [version]\'7.3\') { throw \'retry with shell: pwsh needs PowerShell 7.3 or newer\' }\n$ErrorActionPreference = \'Stop\'\n$PSNativeCommandUseErrorActionPreference = $true\n$global:LASTEXITCODE = 0\n'"$RETRY_COMMAND"$'\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
            run=(pwsh -NoProfile -Command "$ps_command")
            ;;
          *)
            echo "::error::Unsupported shell '$RETRY_SHELL' (expected bash or pwsh)"
            exit 1
            ;;
        esac
        for n in RETRY_MAX_ATTEMPTS RETRY_TIMEOUT_MINUTES RETRY_WAIT_SECONDS; do
          if ! [[ "${!n}" =~ ^[0-9]+$ ]]; then
            echo "::error::$n must be a non-negative integer, got '${!n}'"
            exit 1
          fi
        done
        if [ "$RETRY_MAX_ATTEMPTS" -lt 1 ]; then
          echo "::error::max_attempts must be at least 1"
          exit 1
        fi

        # Run "$@", killing it after the timeout. Prefer coreutils timeout, and
        # fall back to a watchdog where it is missing (hosted macOS runners).
        seconds=$((RETRY_TIMEOUT_MINUTES * 60))
        run_limited() {
          if [ "$seconds" -eq 0 ]; then
            "$@"
          elif command -v timeout >/dev/null 2>&1; then
            timeout --kill-after=30 "$seconds" "$@"
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout --kill-after=30 "$seconds" "$@"
          else
            # Job control gives the attempt its own process group, so the
            # watchdog can signal its descendants like timeout does.
            set -m
            "$@" &
            local pid=$!
            set +m
            (sleep "$seconds"; kill -TERM -- "-$pid"; sleep 30; kill -KILL -- "-$pid") >/dev/null 2>&1 &
            local watchdog=$!
            local rc=0
            wait "$pid" || rc=$?
            kill "$watchdog" >/dev/null 2>&1 || true
            wait "$watchdog" >/dev/null 2>&1 || true
            return "$rc"
          fi
        }

        attempt=1
        while true; do
          status=0
          run_limited "${run[@]}" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$attempt" -ge "$RETRY_MAX_ATTEMPTS" ]; then
            echo "::error::Command failed after $attempt attempt(s) (exit $status)"
            exit "$status"
          fi
          echo "::warning::Attempt $attempt of $RETRY_MAX_ATTEMPTS failed (exit $status); retrying in ${RETRY_WAIT_SECONDS}s"
          sleep "$RETRY_WAIT_SECONDS"
          attempt=$((attempt + 1))
        done
